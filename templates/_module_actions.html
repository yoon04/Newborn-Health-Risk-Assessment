{% if actions %}<div class="score-card card"><h2>Recommended actions by module</h2><p>Each module has its own interpretation. No combined overall risk score is calculated.</p>{% for item in actions %}<div style="padding:12px 0;border-bottom:1px solid #e2d9cb"><h3>{{ item.module }} · {{ item.level }}</h3><p><strong>{{ item.priority }}</strong></p><p>{{ item.action }}</p></div>{% endfor %}</div>{% endif %}
