<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Newborn Health Risk Assessment</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f6f3ee;color:#1f2937;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(420px,100%);background:#fff;padding:30px;border:1px solid #e2d9cb;border-radius:14px;box-shadow:0 18px 50px rgba(17,24,39,.08)}
    h1{margin:0 0 8px;color:#0f766e}p{line-height:1.5;color:#64748b}.field{margin-top:18px}label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.error{margin-top:8px;color:#b91c1c;font-size:13px}.form-error{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px;color:#991b1b;font-size:13px}.links{margin-top:20px;text-align:center;font-size:14px}a{color:#0f766e;font-weight:600}
  </style>
</head>
<body>
<main>
  <h1>Welcome back</h1>
  <p>Log in to complete an assessment and view your saved history.</p>
  {% if errors.form %}<div class="form-error">{{ errors.form }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ form_data.get('email', '') }}" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">Log in</button>
  </form>
  <div class="links">No account yet? <a href="{{ url_for('register') }}">Create one</a></div>
</main>
</body>
</html>
